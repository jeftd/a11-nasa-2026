<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ember Atlas logo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.svg">
<style>
body{margin:0;background:#0b0f17;color:#8b97a8;font:14px system-ui,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;padding:16px}
.c{border:1px solid #233044;border-radius:12px;padding:32px;display:grid;place-items:center;gap:16px;min-height:180px}
.c.light{background:#f5f2ec}
.c img{max-width:100%;height:auto}
.c .wm{height:56px;width:auto}
.c span{font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.sizes{display:flex;gap:16px;align-items:end}
</style></head><body><div class="grid">
<div class="c"><img class="wm" src="ember-atlas.svg"><span>Dark · Bricolage Grotesque</span></div>
<div class="c light"><img class="wm" src="ember-atlas-light.svg"><span>Light · Bricolage Grotesque</span></div>
<div class="c"><div class="sizes"><img src="favicon.svg" width="64"><img src="favicon.svg" width="32"><img src="favicon.svg" width="16"></div><span>Favicon</span></div>
</div></body></html>
